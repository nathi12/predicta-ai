name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 22: `npm test` relies on node --test expanding its glob argument.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # No secrets here on purpose: without API keys the data layer degrades to
      # an empty slate and KV falls back to a local file store, so the build
      # proves the app compiles and prerenders without touching production.
      - run: npm run build
